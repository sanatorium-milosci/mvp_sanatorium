# deploy/docker-compose.yml
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: sanatoria_api
    restart: unless-stopped
    volumes:
      - ../dane:/app/dane
      - ../out:/app/out
      - ../kopie:/app/kopie
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    container_name: sanatoria_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
