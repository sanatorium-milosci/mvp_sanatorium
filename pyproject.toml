[project]
name = "sanatoria-crawler"
version = "0.1.0"
description = "Crawler faktów o komercyjnych pobytach sanatoryjnych w Polsce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "selectolax>=0.3.27,<1",
    "beautifulsoup4>=4.13,<5",
    "protego>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
sanatoria-crawler = "packages.crawler.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests/crawler"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# StrEnum zmienia str(enum); zachowujemy semantykę wspólnego kontraktu z briefu.
"packages/core/models.py" = ["UP042"]
